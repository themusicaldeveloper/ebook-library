<!DOCTYPE html>
<html>
<head>
  <title>ePUB Reader</title>
  <meta charset="UTF-8" />
  <script src="https://unpkg.com/epubjs/dist/epub.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    #viewer {
      height: 100%;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="viewer">Loading ePUB...</div>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const file = urlParams.get('file');

    if (!file) {
      document.getElementById("viewer").innerText = "❌ No ePUB file specified in the URL.";
    } else {
      const book = ePub(file);
      const rendition = book.renderTo("viewer", {
        width: "100%",
        height: "100%"
      });

      rendition.display().catch(err => {
        document.getElementById("viewer").innerText = "❌ Failed to display ePUB.";
        console.error("ePub.js error:", err);
      });
    }
  </script>
</body>
</html>
